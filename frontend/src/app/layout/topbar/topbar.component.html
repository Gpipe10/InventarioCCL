<header class="topbar">
  <a
    class="app-brand"
    routerLink="/"
    aria-label="Sistema de inventario - Inicio"
    (click)="cerrarMenu()">
    <span class="app-brand-logo">
      <img src="/images/logo.png" alt="Corporación Colombiana de Logística" />
    </span>
    <span class="app-brand-text">
      <strong>Sistema de inventario</strong>
      <small>Control y gestión de existencias</small>
    </span>
  </a>

  @if (auth.usuario()) {
    <button
      type="button"
      class="menu-toggle"
      aria-controls="topbar-menu"
      [attr.aria-expanded]="menuAbierto()"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="alternarMenu()">
      <span aria-hidden="true">{{ menuAbierto() ? '✕' : '☰' }}</span>
      <span>Menú</span>
    </button>

    <div
      id="topbar-menu"
      class="topbar-menu"
      [class.is-open]="menuAbierto()">
      <nav aria-label="Navegación principal">
        <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }"
           routerLinkActive="active" (click)="cerrarMenu()">Panel</a>
        <a routerLink="/productos" routerLinkActive="active"
           (click)="cerrarMenu()">Productos</a>
        <a routerLink="/movimientos" routerLinkActive="active"
           (click)="cerrarMenu()">Movimientos</a>
        <a routerLink="/inventario" routerLinkActive="active"
           (click)="cerrarMenu()">Inventario</a>
        <a routerLink="/kardex" routerLinkActive="active"
           (click)="cerrarMenu()">Kardex</a>
      </nav>

      <div class="app-user">
        <span class="app-user-avatar" aria-hidden="true">
          {{ (auth.usuario()?.nombre || 'U').charAt(0).toUpperCase() }}
        </span>
        <span class="app-user-name">{{ auth.usuario()?.nombre }}</span>
      </div>

      <button type="button" class="app-logout" (click)="salir()">
        Cerrar sesión
      </button>
    </div>
  }
</header>
