    <h1>Movimientos</h1>

    <p>
      Registra entradas y salidas.
      El servidor identifica al usuario autenticado.
    </p>

    <app-feedback
      [message]="mensaje"
      [error]="esError" />

    <section class="card">

      <h2>Buscar producto</h2>

      <div class="filters">

        <input
          aria-label="Buscar producto"
          [(ngModel)]="busqueda"
          (keyup.enter)="buscar()"
          placeholder="SKU o nombre" />

        <button
          type="button"
          [disabled]="enviando"
          (click)="buscar()">

          Buscar

        </button>

      </div>

      <label>
        Producto

        <select
          [(ngModel)]="productoId"
          [disabled]="enviando"
          (ngModelChange)="
            stockActual = stockDelProducto($event)
          ">

          <option [ngValue]="0">
            Selecciona un producto activo
          </option>

          @for (
            producto of productos;
            track producto.id
          ) {

            <option [ngValue]="producto.id">

              {{ producto.sku }}
              ·
              {{ producto.nombre }}
              (stock: {{ producto.stock }})

            </option>

          }

        </select>
      </label>

      <p>
        Stock de referencia:
        {{ stockActual }}.
      </p>

    </section>

    <section class="card">

      <div class="tabs">

        <button
          type="button"
          [disabled]="enviando"
          [class.secondary]="tipo !== 'entrada'"
          (click)="tipo = 'entrada'">

          Entrada

        </button>

        <button
          type="button"
          [disabled]="enviando"
          [class.secondary]="tipo !== 'salida'"
          (click)="tipo = 'salida'">

          Salida

        </button>

      </div>

      <h2>
        Registrar {{ tipo }}
      </h2>

      <form
        #form="ngForm"
        class="grid-form"
        (ngSubmit)="registrar(form)">

        <label>
          Cantidad

          <input
            type="number"
            name="cantidad"
            [(ngModel)]="cantidad"
            [disabled]="enviando"
            required
            min="0.001"
            step="0.001" />
        </label>

        @if (tipo === 'entrada') {

          <label>
            Costo unitario

            <input
              type="number"
              name="costo"
              [(ngModel)]="costo"
              [disabled]="enviando"
              required
              min="0"
              step="0.000001" />
          </label>

          <label>
            Proveedor

            <input
              name="proveedor"
              [(ngModel)]="proveedor"
              [disabled]="enviando" />
          </label>

        }

        <label>
          Motivo

          <input
            name="motivo"
            [(ngModel)]="motivo"
            [disabled]="enviando"
            [required]="tipo === 'salida'" />
        </label>

        <label>
          Referencia

          <input
            name="referencia"
            [(ngModel)]="referencia"
            [disabled]="enviando" />
        </label>

        <div class="actions">

          <button
            type="submit"
            [disabled]="
              form.invalid ||
              !productoId ||
              enviando
            ">

            {{
              enviando
                ? 'Registrando…'
                : 'Registrar'
            }}

          </button>

        </div>

      </form>

    </section>
